name: Prueflauf

# Zwei Fragen, ein Lauf:
#   bei jedem Push  — ist die Seite richtig gebaut (fuenfzehn Karten, Signete, keine Doppelten)?
#   woechentlich    — antworten die fuenfzehn veroeffentlichten Blaetter noch?
#
# Die Adressabfrage laeuft nicht bei jedem Push mit: sie prueft die Welt
# draussen, nicht diesen Commit, und ist an einem Dienstagvormittag genauso
# aussagekraeftig wie zwanzig Mal am Tag.

on:
  push:
    paths:
      - "**.html"
      - "**.mjs"
      - ".github/workflows/pruefen.yml"
  workflow_dispatch:
  schedule:
    - cron: "10 6 * * 1"

concurrency:
  group: pruefen-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pruefen:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Browser aus dem Cache
        id: browsercache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-1.47.2-${{ runner.os }}

      - name: Playwright holen
        run: npm install --no-save --no-audit --no-fund playwright@1.47.2

      - name: Chromium holen
        if: steps.browsercache.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      - name: Aufbau der Seite pruefen
        run: node .github/pruefen.mjs --nur-aufbau

      - name: Veroeffentlichte Blaetter abfragen
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: node .github/pruefen.mjs
